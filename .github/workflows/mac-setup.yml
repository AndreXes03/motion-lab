name: Mac setup and export
on:
  pull_request:
    paths: ['src/**', 'project/**', 'index.html', 'vite.config.js', '.agents/**', 'scripts/**', 'native/**', 'Setup Framevolve.command', 'package*.json', '.github/workflows/mac-setup.yml']
  workflow_dispatch:
concurrency:
  group: mac-setup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Browser, launcher and setup regression tests
        run: npm run test:setup
      - name: ZIP update safety and distribution baseline
        run: |
          npm run test:updates
          node scripts/test-studio-update.mjs
          node scripts/agent-context.mjs setup
      - name: Standalone adapter, component and cancellation contracts
        run: |
          npm run test:cycles:standalone
          npm run test:cycles:cancel
      - name: Native audio and project records
        run: |
          node scripts/test-audio-import.mjs
          node scripts/test-native-audio.mjs
          node scripts/test-native-project.mjs
          node scripts/test-cycles-video-encode.mjs
      - name: Native storyboard and frame feedback contracts
        run: npm run test:creative
      - name: Storyboard and frame feedback interface
        run: node scripts/test-storyboard-browser.mjs
      - name: Founder session safety
        run: |
          npm run test:session
          node --test scripts/test-onboarding.mjs
      - name: Clean ZIP first founder session
        run: node scripts/test-founder-session-browser.mjs
      - name: Live feedback contracts
        run: npm run test:live
      - name: Feedback memory contracts
        run: npm run test:feedback
      - name: Feedback memory interface
        run: node scripts/test-feedback-memory-browser.mjs
      - name: Live Studio sequential updates
        run: node scripts/test-live-studio-browser.mjs
      - name: Studio API and render ownership regression
        run: |
          export FRAMEVOLVE_BROWSER_PATH="$(node --input-type=module -e "import {chromium} from 'playwright';console.log(chromium.executablePath())")"
          node scripts/test-studio-api.mjs
      - name: Setup interface checks
        run: node scripts/test-setup-browser.mjs
      - name: Export into a missing nested folder using Chromium
        run: |
          export FRAMEVOLVE_BROWSER_PATH="$(node --input-type=module -e "import {chromium} from 'playwright';console.log(chromium.executablePath())")"
          node scripts/cli.mjs preview --snapshot demo/pop-motion.project.json --start 0 --end 0.1 --width 320 --height 180 --temporal-samples 1 --sound off --out outputs/fresh/nested/pop.mp4
          node scripts/cli.mjs verify --out outputs/fresh/nested/pop.mp4 --time 0
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-setup-evidence
          path: outputs/
