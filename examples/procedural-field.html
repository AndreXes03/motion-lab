<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Lab · Procedural Field</title>
<style>html,body{margin:0;background:#101725;min-height:100%;display:grid;place-items:center}canvas{display:block;width:min(100vw,960px);height:auto} </style>
</head>
<body><canvas id="field" width="960" height="600" aria-label="A regular grid transforms into an animated orbital field"></canvas>
<script>
// One clock, one formula, 792 independently positioned elements. No keyframes.
const SETTINGS = Object.freeze({columns:36, rows:22, duration:6, width:960, height:600, twist:2, petalAmplitude:14});
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const mix = (a,b,t) => a+(b-a)*t;
const smooth = t => t*t*(3-2*t);
const palette = ['#588bff','#f88142','#dce7fa'];
function roundedRect(x,y,w,h,r) {ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function position(row,column,phase,morph) {
  const angle = column/SETTINGS.columns*TAU;
  const radius = 20 + row*8.1;
  const petal = SETTINGS.petalAmplitude*Math.sin(3*angle + SETTINGS.twist*phase)*Math.sin(row/SETTINGS.rows*Math.PI);
  const rotation = .28*Math.sin(phase) + (row/SETTINGS.rows)*.42*Math.sin(phase);
  const orbitX = 480 + (radius+petal)*Math.cos(angle+rotation)*1.34;
  const orbitY = 309 + (radius+petal)*Math.sin(angle+rotation);
  const gridX = 480 + (column-(SETTINGS.columns-1)/2)*20.2;
  const gridY = 309 + (row-(SETTINGS.rows-1)/2)*14.7;
  return {x:mix(gridX,orbitX,morph),y:mix(gridY,orbitY,morph),angle:mix(0,angle+rotation+Math.PI/2,morph)};
}
window.renderAt = function(seconds) {
  const phase = TAU * ((seconds%SETTINGS.duration)/SETTINGS.duration);
  const morph = smooth((1-Math.cos(phase))/2);
  ctx.fillStyle='#101725';ctx.fillRect(0,0,960,600);
  const glow=ctx.createRadialGradient(480,310,20,480,310,440);
  glow.addColorStop(0,'#19283e');glow.addColorStop(1,'#101725');ctx.fillStyle=glow;ctx.fillRect(0,100,960,460);
  ctx.fillStyle='#f1f4fa';ctx.font='600 31px Arial, sans-serif';ctx.fillText('One formula. Infinite motion.',46,59);
  ctx.font='12px monospace';ctx.fillStyle='#8293ae';ctx.fillText('MOTION LAB  /  PROCEDURAL STUDY 01',48,87);
  ctx.strokeStyle='#2a3547';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(46,106);ctx.lineTo(914,106);ctx.stroke();
  // Subtle contours reveal the common rule behind individual elements.
  if(morph>.2) for(let row=1;row<SETTINGS.rows;row+=3) {
    ctx.beginPath();for(let column=0;column<=SETTINGS.columns;column++) {
      const p=position(row,column%SETTINGS.columns,phase,morph);column?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);
    }ctx.strokeStyle=`rgba(131,163,222,${.13*morph})`;ctx.lineWidth=.8;ctx.stroke();
  }
  for(let row=0;row<SETTINGS.rows;row++) for(let column=0;column<SETTINGS.columns;column++) {
    const p=position(row,column,phase,morph);
    const wave=(1+Math.sin(column*.42-row*.29+phase))/2;
    const size=2.9 + 1.3*wave;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);
    ctx.fillStyle=palette[(column+row*2)%11<2?1:((column+row)%5===0?2:0)];
    ctx.globalAlpha=.58+.42*wave;roundedRect(-size*1.25,-size*.49,size*2.5,size*.98,2);ctx.restore();
  }
  ctx.strokeStyle='#2a3547';ctx.beginPath();ctx.moveTo(46,526);ctx.lineTo(914,526);ctx.stroke();
  ctx.fillStyle='#e0e8f7';ctx.font='13px monospace';ctx.fillText(`${SETTINGS.columns*SETTINGS.rows} elements`,48,555);
  ctx.fillStyle='#8293ae';ctx.fillText('grid → orbital field → grid',270,555);
  ctx.fillStyle='#f88142';ctx.fillText('DETERMINISTIC / 6s LOOP',716,555);
  ctx.fillStyle='#536782';ctx.font='11px monospace';ctx.fillText('position = mix(grid, orbit(time), morph(time))',48,578);
};
window.proceduralSettings=SETTINGS;
let start;function tick(now){start??=now;window.renderAt((now-start)/1000);requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></body></html>
